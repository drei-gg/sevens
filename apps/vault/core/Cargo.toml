[package]
name = "vault-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Vault's shared logic: credentials and patterns, the library index and its validation, the version 1 header and .vault7 framing, and format version 2 (age encryption for envelopes, index, originals and backups). Bound to Swift and Kotlin with UniFFI."
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "vault_core"

[[bin]]
# The bindings generator, pinned to the same UniFFI as the library.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "=0.32.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
base64 = "=0.22.1"
caseless = "=0.2.2"
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.26"
thiserror = "=2.0.21"
age = { version = "=0.12.1", default-features = false }
zeroize = "=1.9.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hkdf = "=0.12.4"
rand = "=0.8.8"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
uniffi = { version = "=0.32.2", features = ["build"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# scrypt and age's ciphers are unusably slow unoptimised; tests and the JVM test library build
# them optimised (the crate itself stays a normal debug build).
[profile.dev.package."*"]
opt-level = 3
