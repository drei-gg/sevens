[package]
name = "bloom-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "bloom_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
alarm-core = { path = "../../alarm/core" }
uniffi = "=0.32.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
jiff = { version = "=0.2.43", default-features = false, features = ["std", "alloc", "tzdb-bundle-always"] }
thiserror = "=2.0.21"
age = { version = "=0.12.1", default-features = false }
sha2 = "=0.10.9"
zeroize = "=1.9.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
