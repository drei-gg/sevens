# Not run until Drei pushes. No third-party actions beyond GitHub's own checkout.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  linux:
    name: Linux (swift test, rules)
    runs-on: ubuntu-24.04
    container: swift:6.3   # keep in step with scripts/swift-version
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: SevenKit
        run: swift test --package-path SevenKit
      - name: FastKit
        run: swift test --package-path apps/fast/Kit
      - name: QRKit
        run: swift test --package-path apps/qr/Kit
      - name: AlarmCore
        run: swift test --package-path apps/alarm/Kit
      - name: ScannerKit
        run: swift test --package-path apps/scanner/Kit
      - name: Rules (G6, G7)
        run: scripts/check-rules

  macos:
    name: macOS (xcodebuild test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Test SevenKit
        working-directory: SevenKit
        run: >
          xcodebuild -scheme SevenKit-Package
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test

      - name: Fast's Rust core for iOS
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          scripts/rust-core fast apple
      - name: Install Watch platform for the embedded companion
        run: xcodebuild -downloadPlatform watchOS
      - name: Build and test Fast Tracker
        run: >
          xcodebuild -project apps/fast/Fast.xcodeproj -scheme Fast -configuration Debug
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build test

      - name: Build and test Alarm
        run: >
          xcodebuild -project apps/alarm/Alarm.xcodeproj -scheme Alarm -configuration Debug
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build test

      - name: Build and test QR Code Kit
        run: >
          xcodebuild -project apps/qr/QR.xcodeproj -scheme QR -configuration Debug
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build test
      - name: Test Alarm core and models
        working-directory: apps/alarm/Kit
        run: >
          xcodebuild -scheme AlarmLoopsKit-Package
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test

      - name: Build and test Document Scanner
        run: >
          xcodebuild -project apps/scanner/Scanner.xcodeproj -scheme Scanner -configuration Debug
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build test

      - name: Test Scanner core
        working-directory: apps/scanner/Kit
        run: >
          xcodebuild -scheme ScannerKit
          -destination "platform=iOS Simulator,id=$SIM_UDID" -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test
