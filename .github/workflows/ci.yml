# Deliberately small (2026-11-22): the full suite runs locally with scripts/check, Apple tests in
# the tahoe VM (scripts/check --apple). GitHub runs only these Linux checks, when main moves or by hand.
# No third-party actions beyond GitHub's own checkout.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift packages (swift test)
    runs-on: ubuntu-24.04
    container: swift:6.3   # keep in step with scripts/swift-version
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Each Seven's Swift package
        run: for pkg in SevenKit apps/fast/Kit apps/qr/Kit apps/alarm/Kit apps/scanner/Kit apps/cleaner/Kit apps/bloom/Kit; do swift test --package-path "$pkg"; done

  rust:
    name: Rules and Rust cores
    runs-on: ubuntu-24.04   # has python3, which scripts/check-rules needs (the swift container does not)
    steps:
      - uses: actions/checkout@v4
      - name: Rules (G6, G7)
        run: scripts/check-rules
      - name: Each Seven's shared core
        run: for app in fast qr alarm scanner cleaner vault bloom; do scripts/rust-core "$app" test; done
