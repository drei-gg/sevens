name: Android baseline
on:
  push:
    paths: ['android/**', 'apps/*/android/**', 'apps/*/core/**', 'scripts/rust-core', 'scripts/android', 'scripts/check-android-variants', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'apps/*/android/**', 'apps/*/core/**', 'scripts/rust-core', 'scripts/android', 'scripts/check-android-variants', '.github/workflows/android.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: scripts/rust-core fast test
      - run: android/gradlew -p android :core:test :fast:lintGenericDebug :fast:assembleGenericDebug :fast:assembleGenericRelease
      - run: scripts/check-android-variants
      - run: scripts/rust-core bloom test
      - run: android/gradlew -p android :bloom-core:test :bloom:lintGenericDebug :bloom:assembleGenericDebug :bloom:assembleGenericRelease
